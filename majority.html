<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boyer-Moore Voting Algorithm Visualizer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .array-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 24px 0;
    }
    .cell {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.25s ease;
      border: 2px solid transparent;
    }
    .cell.active {
      border-color: #38bdf8;
      background: #0284c7;
      transform: translateY(-4px);
    }
    .cell.processed {
      opacity: 0.45;
    }
    .state-panel {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
    }
    .stat-box {
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 4px;
    }
    .log-box {
      min-height: 48px;
      background: #334155;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #e2e8f0;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 style="margin: 0; text-align: center;">Boyer-Moore Voting Visualizer</h2>
  <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">
    Observe how opposing candidates cancel each other out.
  </p>

  <div class="array-container" id="arrayCells"></div>

  <div class="state-panel">
    <div class="stat-box">
      <div class="stat-label">Current Element</div>
      <div class="stat-value" id="currVal">-</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Candidate</div>
      <div class="stat-value" id="candVal">-</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Count / Balance</div>
      <div class="stat-value" id="countVal">0</div>
    </div>
  </div>

  <div class="log-box" id="explanation">Click "Next Step" to begin execution.</div>

  <div class="controls">
    <button id="prevBtn" onclick="prevStep()" disabled>Previous</button>
    <button id="nextBtn" onclick="nextStep()">Next Step</button>
    <button id="resetBtn" onclick="resetSim()">Reset</button>
  </div>
</div>

<script>
  const nums = [2, 2, 1, 1, 1, 2, 2];
  let currentStep = -1;
  const history = [];

  function buildHistory() {
    let candidate = null;
    let count = 0;
    for (let i = 0; i < nums.length; i++) {
      const num = nums[i];
      let action = "";
      if (count === 0) {
        candidate = num;
        count = 1;
        action = `Count was 0. New candidate selected: ${candidate} with count = 1.`;
      } else if (num === candidate) {
        count++;
        action = `${num} matches candidate ${candidate}. Balance increments to ${count}.`;
      } else {
        count--;
        action = `${num} conflicts with candidate ${candidate}. One soldier cancelled, balance drops to ${count}.`;
      }
      history.push({ index: i, num, candidate, count, action });
    }
  }

  function renderArray() {
    const container = document.getElementById("arrayCells");
    container.innerHTML = "";
    nums.forEach((val, i) => {
      const el = document.createElement("div");
      el.className = "cell";
      el.id = `cell-${i}`;
      el.innerText = val;
      container.appendChild(el);
    });
  }

  function updateUI() {
    document.querySelectorAll(".cell").forEach((el, i) => {
      el.className = "cell";
      if (currentStep >= 0 && i < currentStep) el.classList.add("processed");
      if (i === currentStep) el.classList.add("active");
    });

    if (currentStep >= 0 && currentStep < history.length) {
      const state = history[currentStep];
      document.getElementById("currVal").innerText = state.num;
      document.getElementById("candVal").innerText = state.candidate;
      document.getElementById("countVal").innerText = state.count;
      document.getElementById("explanation").innerText = state.action;
    } else if (currentStep >= history.length) {
      const finalState = history[history.length - 1];
      document.getElementById("currVal").innerText = "End";
      document.getElementById("explanation").innerText = 
        `Execution finished! Majority Element is ${finalState.candidate}.`;
    } else {
      document.getElementById("currVal").innerText = "-";
      document.getElementById("candVal").innerText = "-";
      document.getElementById("countVal").innerText = "0";
      document.getElementById("explanation").innerText = "Click 'Next Step' to begin.";
    }

    document.getElementById("prevBtn").disabled = currentStep <= 0;
    document.getElementById("nextBtn").disabled = currentStep >= history.length;
  }

  function nextStep() {
    if (currentStep < history.length) {
      currentStep++;
      updateUI();
    }
  }

  function prevStep() {
    if (currentStep > 0) {
      currentStep--;
      updateUI();
    }
  }

  function resetSim() {
    currentStep = -1;
    updateUI();
  }

  buildHistory();
  renderArray();
  updateUI();
</script>
</body>
</html>
